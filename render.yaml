# Render Blueprint — the app + database from docs/architecture.md's Hosting
# section, as code. Render reads this on "New → Blueprint"; after that,
# every push to main deploys through it.
#
# The important line is preDeployCommand: migrations run against the live
# database *before* the new build takes traffic, and a failed migration
# aborts the deploy instead of shipping code that expects columns that
# don't exist yet. Nothing else in the repo runs migrations — Docker
# Compose is local Postgres only.
services:
  - type: web
    name: smartdepo
    runtime: node
    plan: starter
    region: frankfurt # closest Render region to Kosovo
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    preDeployCommand: pnpm db:migrate
    startCommand: pnpm start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: smartdepo-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      # Set these in the Render dashboard — secrets and per-environment
      # values that don't belong in the repo. See .env.example for what
      # each one does and which are safe to leave empty.
      - key: PLATFORM_ADMIN_EMAILS
        sync: false
      - key: NEXT_PUBLIC_SUPPORT_EMAIL
        value: pikembipresje@gmail.com
      - key: NEXT_PUBLIC_LEGAL_NAME
        sync: false
      - key: NEXT_PUBLIC_COMPANY_REG_NO
        sync: false
      - key: NEXT_PUBLIC_COMPANY_ADDRESS
        sync: false
      # Outgoing mail: Gmail SMTP with an App Password (set SMTP_PASS in
      # the dashboard), or leave SMTP_PASS empty and set RESEND_API_KEY.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: pikembipresje@gmail.com
      - key: SMTP_PASS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: SmartDepo <pikembipresje@gmail.com>
      - key: PAYSERA_PROJECT_ID
        sync: false
      - key: PAYSERA_SIGN_PASSWORD
        sync: false
      - key: PAYSERA_TEST_MODE
        value: "1"
      # Site-ownership <meta> tag from the Checkout project's
      # "Konfirmimi i projektit" section: name attribute and content value.
      - key: NEXT_PUBLIC_PAYSERA_VERIFICATION_NAME
        sync: false
      - key: NEXT_PUBLIC_PAYSERA_VERIFICATION_VALUE
        sync: false
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
      - key: SENTRY_ORG
        sync: false
      - key: SENTRY_PROJECT
        sync: false
      - key: SENTRY_AUTH_TOKEN
        sync: false

databases:
  - name: smartdepo-db
    plan: starter
    region: frankfurt
    postgresMajorVersion: "16"
